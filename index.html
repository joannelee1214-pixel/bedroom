    <style>
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;

        background-image: url("https://raw.githubusercontent.com/joannelee1214-pixel/for-bedroom/18212093307256d85a54ae9b6e77d766c7c90375/empty2.png");
        background-size: cover;
        background-position: center;
                background-repeat: no-repeat;
        /*         font-family: 'Montserrat', sans-serif; */
      }



      .bed {
        display: none;
        background-color: rgba(40, 41, 31, 0.75);
        width: 92vw;
        height: 92vh;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }


      .chair {
        display: none;
        background-color: rgba(40, 41, 31, 0.75);
        width: 92vw;
        height: 92vh;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      
      
      
      .window {
        display: none;
        background-color: rgba(40, 41, 31, 0.75);
        width: 92vw;
        height: 92vh;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>

  </head>
  <body>

    <div class="bed">
    </div>

    <div class="chair">
    </div>

    <div class="window">
    </div>
